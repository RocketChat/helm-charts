{{- if eq (include "rocketchat-livekit.isTrue" .Values.serviceAccount.create) "true" -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "rocketchat-livekit.serviceAccountName" . }}
  labels:
    {{- include "rocketchat-livekit.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
{{- end }}
