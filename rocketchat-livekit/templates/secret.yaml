{{- if not .Values.credentials.existingSecret }}
{{- /*
The key pair is generated once and read back on upgrades, so Rocket.Chat
and LiveKit don't drift apart. The Secret is kept on uninstall: launchcontrol
keeps pointing Rocket.Chat at it while the plugin is listed on the workspace,
even when disabled, and a reinstall adopts it again.
*/}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace .Values.credentials.secretName | default dict }}
{{- $apiKey := .Values.credentials.apiKey | default (dig "data" "apiKey" "" $existing | b64dec) | default (printf "API%s" (randAlphaNum 12)) }}
{{- $apiSecret := .Values.credentials.apiSecret | default (dig "data" "apiSecret" "" $existing | b64dec) | default (randAlphaNum 48) }}
{{- if lt (len $apiSecret) 32 }}
{{- fail "credentials.apiSecret must be at least 32 characters long" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.credentials.secretName }}
  labels:
    {{- include "rocketchat-livekit.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  apiKey: {{ $apiKey | quote }}
  apiSecret: {{ $apiSecret | quote }}
  url: {{ printf "wss://%s" (include "rocketchat-livekit.host" .) | quote }}
{{- end }}
