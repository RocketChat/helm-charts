replicaCount: 1

microservices:
  enabled: false

nats:
  enabled: false

persistence:
  enabled: false

ingress:
  enabled: false

securityContext:
  runAsUser: 2000
  fsGroup: 2000

containerSecurityContext:
  runAsUser: 2000

extraVolumes:
  - name: deno-runtime
    emptyDir: {}

extraVolumeMounts:
  - name: deno-runtime
    mountPath: /app/bundle/programs/server/npm/node_modules/@rocket.chat/apps/deno-runtime

extraInitContainers:
  - name: seed-deno-runtime
    image: "{{ include \"rocketchat.image\" (dict \"repository\" .Values.image.repository \"tag\" .Values.image.tag \"appVersion\" .Chart.AppVersion \"global\" .Values.global) }}"
    command:
      - sh
      - -c
      - cp -r /app/bundle/programs/server/npm/node_modules/@rocket.chat/apps/deno-runtime/. /seed/
    volumeMounts:
      - name: deno-runtime
        mountPath: /seed
    securityContext:
      runAsUser: 2000   # keep in sync with containerSecurityContext.runAsUser above
      runAsNonRoot: true
      
externalMongodbUrl: mongodb+srv://debdut:debdut2000@cluster0.gruedm.mongodb.net/lololol

mongodb:
  enabled: false
  persistence:
    enabled: false
  auth:
    usernames:
      - rocketchat
    passwords:
      - rocketchat