{{- if .Values.httproute.enabled -}}
{{- $route := .Values.httproute -}}
{{- if not $route.parentRefs -}}
{{- fail "httproute.enabled is true but httproute.parentRefs is empty; an HTTPRoute needs at least one parentRef to attach to a Gateway" -}}
{{- end -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ template "rocketchat.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "rocketchat.name" . }}
    helm.sh/chart: {{ include "rocketchat.chart" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  {{- with $route.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $route.parentRefs }}
  parentRefs:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.host }}
  hostnames:
    - {{ tpl . $ | quote }}
  {{- end }}
  rules:
    {{- with $route.extraRules }}
    {{- tpl (toYaml .) $ | nindent 4 }}
    {{- end }}
    - backendRefs:
        - name: {{ template "rocketchat.fullname" . }}
          port: {{ .Values.service.port }}
      {{- with $route.matches }}
      matches:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $route.filters }}
      filters:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- if .Values.microservices.enabled }}
    - backendRefs:
        - name: {{ .Release.Name }}-ddp-streamer
          port: 3000
      matches:
        - path:
            type: PathPrefix
            value: /sockjs
        - path:
            type: PathPrefix
            value: /websocket
    {{- end }}
{{- end -}}
